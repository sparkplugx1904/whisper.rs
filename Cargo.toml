[workspace]
members = [
    "crates/tensor",
    "crates/audio",
    "crates/model",
    "crates/tokenizer",
    "crates/whisper",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["whisper.rs contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sparkplugx1904/whisper.rs"

[workspace.dependencies]
thiserror = "2.0"
byteorder = "1.5"
memmap2 = "0.9"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
