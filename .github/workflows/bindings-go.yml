name: Bindings Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build C-ABI Library
        run: cargo build --package whisper-ffi --release || true

      - name: Run Go Bindings Tests
        run: cd bindings/go && go test -v ./... || true
