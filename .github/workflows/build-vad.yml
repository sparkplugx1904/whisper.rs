name: Build VAD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-vad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build VAD subsystem
        run: cargo build --package whisper-audio --release

      - name: Test Audio Frontend
        run: cargo test --package whisper-audio --release
