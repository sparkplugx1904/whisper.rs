name: Bindings Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build C-ABI Library (libwhisper)
        run: cargo build --package whisper-ffi --release --verbose

      - name: Run Go Bindings Tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
          C_INCLUDE_PATH: ${{ github.workspace }}/include
          LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: cd bindings/go && CGO_ENABLED=1 go test -v .
