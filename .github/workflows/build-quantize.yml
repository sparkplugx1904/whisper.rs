name: Build Quantize

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-quantize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Quantizer Binary
        run: cargo build --package whisper-quantize --release --verbose

      - name: Test Quant Kernels
        run: cargo test --package whisper-tensor --test test_quant_kernels --release --verbose
