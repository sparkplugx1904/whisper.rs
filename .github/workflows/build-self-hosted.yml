name: Build Self-Hosted

on:
  workflow_dispatch:

jobs:
  self-hosted-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Benchmark Execution
        run: cargo test --release --package whisper-rs-pure --test bench_comparison -- --nocapture
