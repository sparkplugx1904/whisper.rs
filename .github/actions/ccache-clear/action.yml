name: "Clear Stale Build Cache"
description: "Cleans stale or corrupted build directories and temporary object caches"
inputs:
  target-dir:
    description: "Target directory to clean if oversized"
    required: false
    default: "target"

runs:
  using: "composite"
  steps:
    - name: Clean Stale Target Cache
      shell: bash
      run: |
        if [ -d "${{ inputs.target-dir }}" ]; then
          echo "Pruning stale build artifacts in ${{ inputs.target-dir }}..."
          rm -rf "${{ inputs.target-dir }}/release/incremental"
          rm -rf "${{ inputs.target-dir }}/debug/incremental"
        fi
