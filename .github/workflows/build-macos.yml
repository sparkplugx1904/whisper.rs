name: Build macOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  macos-build:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build macOS Target
        run: cargo build --workspace --target ${{ matrix.target }} --release --verbose

      - name: Test on Native Host
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --workspace --target ${{ matrix.target }} --release --verbose
